user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression Optimization
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client Request Size Limits (Important for Image/HEIC Uploads)
    client_max_body_size 20M;

    upstream app_server {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers (Enforced at Nginx Layer)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Serve static assets directly through Nginx for speed
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Serve media files directly through Nginx
        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Forward all dynamic application requests to Gunicorn
        location / {
            proxy_pass http://app_server;
            proxy_redirect off;
            
            # Forwarding headers required for Django's security checks
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
        }
    }
}
