upstream app_server {
    # Path to Gunicorn Unix socket as configured in systemd
    server unix:/run/gunicorn.sock fail_timeout=0;
}

# 1. HTTP Server - Redirects all traffic to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name marsabaltim.com www.marsabaltim.com;

    # Let's Encrypt Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://marsabaltim.com$request_uri;
    }
}

# 2. HTTPS Server - Secure Production Environment
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marsabaltim.com www.marsabaltim.com;

    # Let's Encrypt SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/marsabaltim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marsabaltim.com/privkey.pem;

    # Secure SSL Protocols & Ciphers (Modern standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Basic performance and compression configurations
    client_max_body_size 20M;
    keepalive_timeout 65;

    # Gzip Compression Optimization
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers (Enforced at Nginx layer)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 3. Serve Static Files Directly (Bypasses Django/Python)
    location /static/ {
        alias /var/www/marsabaltim/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Redirect Media local requests (Optional fallback - Media is stored on Amazon S3)
    location /media/ {
        alias /var/www/marsabaltim/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 5. Forward dynamic requests to Gunicorn via Unix Domain Socket
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Don't redirect back to HTTP on proxy pass
        proxy_redirect off;
        
        # Connect proxy to systemd Unix socket
        proxy_pass http://app_server;
    }
}
