services:
  db:
    image: postgres:15-alpine
    container_name: baltim_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-baltim}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ahmed123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-baltim}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baltim_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baltim_web
    restart: always
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-web,localhost}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-ahmed123}@db:5432/${DB_NAME:-baltim}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-True}
      - SIMPLE_JWT_COOKIE_SECURE=${SIMPLE_JWT_COOKIE_SECURE:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - baltim_network

  nginx:
    image: nginx:alpine
    container_name: baltim_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    depends_on:
      - web
    networks:
      - baltim_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  baltim_network:
    driver: bridge
